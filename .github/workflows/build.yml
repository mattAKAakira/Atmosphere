name: Build Atmosphere
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      # ✅ 只用官方永远存在的latest标签，绝对不会pull失败
      image: devkitpro/devkita64:latest
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64
      DEVKITARM: /opt/devkitpro/devkitARM
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/opt/devkitpro/devkitA64/bin:/opt/devkitpro/devkitARM/bin:/opt/devkitpro/tools/bin
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory '*'
      # ✅ 只加这一步：从GitHub拉最新版libnx（开源仓库，不会403）覆盖镜像里的旧版本，补上缺失的pglEnableApplicationCrashReport2等API
      # ✅ 完全不碰apt.devkitpro.org/pkg.devkitpro.org，避开Cloudflare 403拦截
      - run: |
          wget -q https://github.com/switchbrew/libnx/releases/latest/download/libnx-dev.tar.zst -O /tmp/libnx.tar.zst
          tar -I zstd -xf /tmp/libnx.tar.zst -C $DEVKITPRO/portlibs/switch --strip-components=1
      # ✅ 单线程编译 + -Wno-error覆盖-Werror，警告不会中断
      - run: make -j1 ATMOSPHERE_CFLAGS="-Wno-error" ATMOSPHERE_CXXFLAGS="-Wno-error" dist-no-debug-nx_release
      - uses: actions/upload-artifact@v4
        with:
          name: atmosphere-build
          path: out/nintendo_nx_arm64_armv8a/release/*
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/nintendo_nx_arm64_armv8a/release/*
