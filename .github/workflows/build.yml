name: Build Atmosphere
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64
      DEVKITARM: /opt/devkitpro/devkitARM
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/opt/devkitpro/devkitA64/bin:/opt/devkitpro/devkitARM/bin:/opt/devkitpro/tools/bin
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory '*'
      # ✅ 完全去掉heredoc嵌套，用简单echo命令追加内容，100%不会有格式/语法错误
      - run: |
          PGL_H=$(find /opt/devkitpro -name "pgl.h" -path "*/services/*" | head -1)
          curl -fL --connect-timeout 10 --retry 2 https://raw.githubusercontent.com/switchbrew/libnx/master/nx/include/switch/services/pgl.h -o "$PGL_H" || true
          # 头文件声明：一行一条，简单追加，无嵌套
          echo '#ifdef __cplusplus' >> "$PGL_H"
          echo 'extern "C" {' >> "$PGL_H"
          echo '#endif' >> "$PGL_H"
          echo 'struct PglEventObserver;' >> "$PGL_H"
          echo 'typedef unsigned int u32_compat;' >> "$PGL_H"
          echo 'typedef u32_compat Result_compat;' >> "$PGL_H"
          echo 'Result_compat pglCreateShellEvent(struct PglEventObserver* out);' >> "$PGL_H"
          echo 'Result_compat pglEnableApplicationCrashReport2(u32_compat process_id, int enabled);' >> "$PGL_H"
          echo 'Result_compat pglEventObserverGetShellEvent(struct PglEventObserver* observer, u32_compat* out_event);' >> "$PGL_H"
          echo 'Result_compat pglEventObserverGetShellEventInfo(struct PglEventObserver* observer, void* out_info);' >> "$PGL_H"
          echo '#ifdef __cplusplus' >> "$PGL_H"
          echo '}' >> "$PGL_H"
          echo '#endif' >> "$PGL_H"
          # C实现文件：同样一行一条，无嵌套
          STUB_FILE=libraries/libstratosphere/source/pgl/pgl_compat_stub.c
          echo 'struct PglEventObserver;' > "$STUB_FILE"
          echo 'typedef unsigned int u32_compat;' >> "$STUB_FILE"
          echo 'typedef u32_compat Result_compat;' >> "$STUB_FILE"
          echo 'Result_compat pglCreateShellEvent(struct PglEventObserver* out) { (void)out; return 0; }' >> "$STUB_FILE"
          echo 'Result_compat pglEnableApplicationCrashReport2(u32_compat pid, int en) { (void)pid; (void)en; return 0; }' >> "$STUB_FILE"
          echo 'Result_compat pglEventObserverGetShellEvent(struct PglEventObserver* obs, u32_compat* ev) { (void)obs; (void)ev; return 0; }' >> "$STUB_FILE"
          echo 'Result_compat pglEventObserverGetShellEventInfo(struct PglEventObserver* obs, void* info) { (void)obs; (void)info; return 0; }' >> "$STUB_FILE"
      # 编译参数完全不变，和之前跑30分钟的版本一致
      - run: |
          make -j1 \
            USER_CFLAGS="-Wno-error" \
            USER_CXXFLAGS="-Wno-error -fno-rtti -fno-exceptions" \
            dist-no-debug-nx_release
      - uses: actions/upload-artifact@v4
        with:
          name: atmosphere-build
          path: out/nintendo_nx_arm64_armv8a/release/*
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/nintendo_nx_arm64_armv8a/release/*
