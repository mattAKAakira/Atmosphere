name: Build Atmosphere
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64
      DEVKITARM: /opt/devkitpro/devkitARM
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/opt/devkitpro/devkitA64/bin:/opt/devkitpro/devkitARM/bin:/opt/devkitpro/tools/bin
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory '*'
      # ✅ 修正：用标准变量名+根因修复
      #   1. 加-fno-rtti -fno-exceptions：裸机bootloader不需要RTTI/异常，从根源不生成__si_class_type_info引用
      #   2. 用make内置LDLIBS变量传链接库，自动放在链接命令最后，顺序正确，不会被忽略
      #   3. 去掉不存在的自定义变量名，保证所有参数被构建系统识别
      - run: |
          make -j1 \
            ATMOSPHERE_CFLAGS="-std=gnu2x -Wno-error" \
            ATMOSPHERE_CXXFLAGS="-std=gnu++20 -Wno-error -fno-rtti -fno-exceptions" \
            LDLIBS="-lsupc++ -lstdc++ -lgcc" \
            dist-no-debug-nx_release
      - uses: actions/upload-artifact@v4
        with:
          name: atmosphere-build
          path: out/nintendo_nx_arm64_armv8a/release/*
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/nintendo_nx_arm64_armv8a/release/*
