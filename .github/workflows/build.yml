name: Build Atmosphere
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64
      DEVKITARM: /opt/devkitpro/devkitARM
      PATH: /opt/devkitpro/devkitA64/bin:/opt/devkitpro/devkitARM/bin:/opt/devkitpro/tools/bin:${PATH}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory '*'
      - run: make -j1 dist-no-debug-nx_release
      - uses: actions/upload-artifact@v4
        with:
          name: atmosphere-build
          path: out/nintendo_nx_arm64_armv8a/release/*
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/nintendo_nx_arm64_armv8a/release/*
