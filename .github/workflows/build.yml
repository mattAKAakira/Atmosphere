name: Build Atmosphere

on:
  push:
    tags: ['v*']          # 打 v 开头的 tag 时自动构建
  workflow_dispatch:      # 也支持在 Actions 页面手动触发

permissions:
  contents: write         # 打 tag 时需要创建 Release

jobs:
  build:
    name: 编译大气层核心
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest   # 官方镜像,自带 devkitA64 / devkitARM / switch-dev / hactool / zip / python3-lz4

    steps:
      - name: 拉取源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # 取全量历史,保证版本号里的 git 短哈希可用

      - name: 配置 devkitPro 工具链环境变量
        run: |
          echo "DEVKITPRO=/opt/devkitpro"        >> "$GITHUB_ENV"
          echo "DEVKITA64=/opt/devkitpro/devkitA64" >> "$GITHUB_ENV"
          echo "DEVKITARM=/opt/devkitpro/devkitARM" >> "$GITHUB_ENV"
          {
            echo "/opt/devkitpro/tools/bin"
            echo "/opt/devkitpro/devkitA64/bin"
            echo "/opt/devkitpro/devkitARM/bin"
          } >> "$GITHUB_PATH"

      - name: 补齐编译依赖
        run: |
          dkp-pacman -S --needed --noconfirm \
            switch-dev switch-glm switch-libjpeg-turbo \
            devkitA64 devkitARM devkitarm-rules hactool

      - name: 校验工具链
        run: |
          aarch64-none-elf-gcc --version
          arm-none-eabi-gcc --version
          python -c "import lz4; print('lz4 ok')"
          command -v build_romfs
          command -v zip

      - name: 编译并打包成可刷入 SD 卡的固件
        run: make -j"$(nproc)" dist-no-debug-nx_release

      - name: 列出产物
        run: ls -lh out/nintendo_nx_arm64_armv8a/release/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: atmosphere-nx-build
          path: |
            out/nintendo_nx_arm64_armv8a/release/*.zip
            out/nintendo_nx_arm64_armv8a/release/fusee.bin
          if-no-files-found: error

      - name: 打 tag 时创建 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/nintendo_nx_arm64_armv8a/release/*.zip
            out/nintendo_nx_arm64_armv8a/release/fusee.bin
          generate_release_notes: true
