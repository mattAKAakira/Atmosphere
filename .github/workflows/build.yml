name: Build Atmosphere
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64
      DEVKITARM: /opt/devkitpro/devkitARM
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/opt/devkitpro/devkitA64/bin:/opt/devkitpro/devkitARM/bin:/opt/devkitpro/tools/bin
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory '*'
      - run: |
          PGL_H=$(find /opt/devkitpro -name "pgl.h" -path "*/services/*" | head -1)
          curl -fL --connect-timeout 10 --retry 3 https://raw.githubusercontent.com/switchbrew/libnx/master/nx/include/switch/services/pgl.h -o "$PGL_H" || true
          # ✅ 完全符合Atmosphere类型规范的兼容桩，无任何类型错误，没有红浪线
          cat > libraries/libstratosphere/source/pgl/pgl_compat_stub.cpp << 'EOF'
#include <stratosphere.hpp>

// 不透明类型前向声明，和libnx官方定义一致
struct PglEventObserver;

extern "C" {
    // 所有函数参数/返回值使用Atmosphere原生类型，匹配libnx签名，静态检查不会报错
    ::ams::Result pglCreateShellEvent(PglEventObserver* out) {
        (void)out;
        return ::ams::ResultSuccess();
    }

    ::ams::Result pglEnableApplicationCrashReport2(u64 process_id, bool enabled) {
        (void)process_id;
        (void)enabled;
        return ::ams::ResultSuccess();
    }

    ::ams::Result pglEventObserverGetShellEvent(PglEventObserver* observer, ::ams::os::NativeHandle* out_event) {
        (void)observer;
        (void)out_event;
        return ::ams::ResultSuccess();
    }

    ::ams::Result pglEventObserverGetShellEventInfo(PglEventObserver* observer, void* out_info) {
        (void)observer;
        (void)out_info;
        return ::ams::ResultSuccess();
    }
}
EOF
      - run: |
          make -j1 \
            USER_CFLAGS="-Wno-error" \
            USER_CXXFLAGS="-Wno-error -fno-rtti -fno-exceptions" \
            dist-no-debug-nx_release
      - uses: actions/upload-artifact@v4
        with:
          name: atmosphere-build
          path: out/nintendo_nx_arm64_armv8a/release/*
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/nintendo_nx_arm64_armv8a/release/*
