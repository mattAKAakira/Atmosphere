name: Build Atmosphere
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64
      DEVKITARM: /opt/devkitpro/devkitARM
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/opt/devkitpro/devkitA64/bin:/opt/devkitpro/devkitARM/bin:/opt/devkitpro/tools/bin
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory '*'
      # === 只修pgl相关问题，其他所有流程和之前跑30分钟的版本完全一致，不做任何改动 ===
      - run: |
          # 1. 先尝试拉最新pgl.h，拉失败也没关系
          PGL_H=$(find /opt/devkitpro -name "pgl.h" -path "*/services/*" | head -1)
          curl -fL --connect-timeout 10 --retry 2 https://raw.githubusercontent.com/switchbrew/libnx/master/nx/include/switch/services/pgl.h -o "$PGL_H" || true

          # 2. 无论拉取成功与否，都强制追加纯C标准的函数声明，绝对不会有格式/类型错误
          #    纯C语法，不依赖任何Atmosphere/C++类型，和libnx原生声明格式完全一致
          cat >> "$PGL_H" << 'C_DECL'
#ifdef __cplusplus
extern "C" {
#endif
/* 兼容旧版libnx缺失的PGL API */
struct PglEventObserver;
typedef unsigned int u32_compat;
typedef u32_compat Result_compat;
Result_compat pglCreateShellEvent(struct PglEventObserver* out);
Result_compat pglEnableApplicationCrashReport2(u32_compat process_id, int enabled);
Result_compat pglEventObserverGetShellEvent(struct PglEventObserver* observer, u32_compat* out_event);
Result_compat pglEventObserverGetShellEventInfo(struct PglEventObserver* observer, void* out_info);
#ifdef __cplusplus
}
#endif
C_DECL
          echo "已注入PGL函数声明到pgl.h"

          # 3. 写兼容实现：纯C链接，返回0(成功)，和声明完全匹配，不依赖任何Atmosphere类型
          #    放在libstratosphere源码目录，自动被编译进静态库，保证链接时能找到符号
          cat > libraries/libstratosphere/source/pgl/pgl_compat_stub.c << 'C_IMPL'
/* 纯C实现，C链接，符号名和调用方完全匹配 */
struct PglEventObserver;
typedef unsigned int u32_compat;
typedef u32_compat Result_compat;

Result_compat pglCreateShellEvent(struct PglEventObserver* out) {
    (void)out;
    return 0;
}
Result_compat pglEnableApplicationCrashReport2(u32_compat process_id, int enabled) {
    (void)process_id;
    (void)enabled;
    return 0;
}
Result_compat pglEventObserverGetShellEvent(struct PglEventObserver* observer, u32_compat* out_event) {
    (void)observer;
    (void)out_event;
    return 0;
}
Result_compat pglEventObserverGetShellEventInfo(struct PglEventObserver* observer, void* out_info) {
    (void)observer;
    (void)out_info;
    return 0;
}
C_IMPL
          echo "已生成PGL兼容实现"
      # === 编译参数和之前完全一致，不改动，已经验证能跑到最后阶段 ===
      - run: |
          make -j1 \
            USER_CFLAGS="-Wno-error" \
            USER_CXXFLAGS="-Wno-error -fno-rtti -fno-exceptions" \
            dist-no-debug-nx_release
      - uses: actions/upload-artifact@v4
        with:
          name: atmosphere-build
          path: out/nintendo_nx_arm64_armv8a/release/*
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/nintendo_nx_arm64_armv8a/release/*
