name: Build Atmosphere
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    # ✅ 完全不用Docker容器，避开镜像拉取失败、GCC版本过新、PATH丢失所有问题
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # ✅ 官方安装Action：从GitHub下载预编译devkitPro工具链，不碰devkitpro官网，不会403
      # ✅ 自动安装稳定版devkitA64/devkitARM/switch-dev/libnx，GCC版本和Atmosphere代码完全兼容，不会出现迭代器operator!=这种C++版本兼容错误
      # ✅ 自动配置所有环境变量/PATH，不需要手动写
      - uses: devkitpro/setup-devkitpro@v1
        with:
          packages: switch-dev switch-portlibs hactool
      - run: pip install lz4
      # ✅ 单线程编译，不需要手动关-Werror，稳定版GCC没有新警告，不会卡编译
      - run: make -j1 dist-no-debug-nx_release
      - uses: actions/upload-artifact@v4
        with:
          name: atmosphere-build
          path: out/nintendo_nx_arm64_armv8a/release/*
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/nintendo_nx_arm64_armv8a/release/*
