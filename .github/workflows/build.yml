name: Build Atmosphere 1.12.0

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64
      DEVKITARM: /opt/devkitpro/devkitARM
      PATH: /opt/devkitpro/devkitA64/bin:/opt/devkitpro/devkitARM/bin:/opt/devkitpro/tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    steps:
      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 \
            python3-lz4 \
            python3-pycryptodome \
            lz4

      - name: 检出 Atmosphère 1.12.0 源码
        uses: actions/checkout@v5
        with:
          ref: 1.12.0
          fetch-depth: 0
          submodules: recursive

      - name: 构建
        run: |
          make -j$(nproc) dist-no-debug-nx_release

      - name: 上传构建产物
        uses: actions/upload-artifact@v5
        with:
          name: atmosphere-1.12.0-build
          path: out/nintendo_nx_arm64_armv8a/release/*

      - name: 创建 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: out/nintendo_nx_arm64_armv8a/release/*
