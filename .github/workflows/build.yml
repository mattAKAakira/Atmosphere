name: Build Atmosphere
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64
      DEVKITARM: /opt/devkitpro/devkitARM
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/opt/devkitpro/devkitA64/bin:/opt/devkitpro/devkitARM/bin:/opt/devkitpro/tools/bin
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory '*'
      # ✅ 不依赖外网下载，手动追加你代码里用到的所有缺失pgl函数声明，参数和你贴的pgl_shell_api.cpp完全匹配
      # ✅ 自动找pgl.h路径，追加后自动校验是否写入成功
      - run: |
          PGL_H=$(find /opt/devkitpro -name "pgl.h" -path "*/services/*" | head -1)
          echo "找到pgl.h: $PGL_H"
          # 追加两个缺失的函数声明，和libnx官方声明格式完全一致，参数和你代码匹配
          cat >> "$PGL_H" << 'EOF'
Result pglCreateShellEvent(PglEventObserver* out);
Result pglEnableApplicationCrashReport2(u64 process_id, bool enabled);
EOF
          # 校验是否写入成功
          echo "检查是否已追加声明:"
          grep -E "pglCreateShellEvent|pglEnableApplicationCrashReport2" "$PGL_H"
      - run: |
          make -j1 \
            USER_CFLAGS="-Wno-error" \
            USER_CXXFLAGS="-Wno-error -fno-rtti -fno-exceptions" \
            dist-no-debug-nx_release
      - uses: actions/upload-artifact@v4
        with:
          name: atmosphere-build
          path: out/nintendo_nx_arm64_armv8a/release/*
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/nintendo_nx_arm64_armv8a/release/*
